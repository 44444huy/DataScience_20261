services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stackoverflow}
      POSTGRES_USER: ${POSTGRES_USER:-stackoverflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackoverflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stackoverflow} -d ${POSTGRES_DB:-stackoverflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:

